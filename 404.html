<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Sudhir Gunnam</title>
<style>
:root{--bg:#101316;--panel:#171b20;--line:#303940;--text:#f1f4f6;--accent:#4b91c9;--sans:Manrope,sans-serif;--mono:"DM Mono",monospace}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:var(--sans);text-align:center}
main{padding:24px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
h1{font-size:2rem;font-weight:500}
.button{display:inline-block;border:1px solid var(--accent);padding:12px 18px;color:var(--text);text-decoration:none;font-size:13px;font-weight:700}
.button.primary{background:var(--accent);color:var(--bg)}
</style>
</head>
<body>
<main>
<div class="eyebrow">404</div>
<h1>Page not found.</h1>
<a class="button primary" href="https://sudhir734.github.io/">Return home</a>
</main>
</body>
</html>
