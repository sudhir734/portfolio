<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page Not Found — Sudhir Gunnam Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #fafafa;
        color: #080808;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e8e8e8;
        border-radius: 24px;
        padding: 48px 32px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      }
      h1 {
        font-size: 32px;
        font-weight: 900;
        margin: 0 0 12px 0;
        letter-spacing: -0.03em;
      }
      p {
        color: #666666;
        font-size: 15px;
        line-height: 1.6;
        margin: 0 0 28px 0;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #080808;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 28px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        transition: transform 0.2s, background 0.2s;
      }
      a:hover {
        background: #222222;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div style="font-size: 40px; margin-bottom: 16px;">◆</div>
      <h1>404 // NOT FOUND</h1>
      <p>The requested security resource or URL does not exist or has been relocated.</p>
      <a href="/portfolio/">Return to Portfolio &rarr;</a>
    </div>
  </body>
</html>
